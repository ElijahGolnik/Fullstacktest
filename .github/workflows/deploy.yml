name: Build and Deploy to Local Kubernetes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:

        # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./fullstackapp
          push: true
          tags: elijahgolnik/myapp:${{ github.sha }},elijahgolnik/myapp:latest
          platforms: linux/amd64,linux/arm64

      - name: Use Windows kubeconfig
        run: |
          export KUBECONFIG=/mnt/c/Users/proto/.kube/config
          kubectl config use-context docker-desktop
          kubectl get nodes
          kubectl apply -f fullstackapp/k8s/

      - name: Wait for Kubernetes
        run: |
          kubectl config use-context docker-desktop

          for i in {1..20}; do
            kubectl get nodes && break
            echo "Waiting for cluster..."
            sleep 3
          done

      # 8. Force rollout (important when using :latest)
      - name: Restart deployment
        run: |
          kubectl rollout restart deployment fullstackapp

      # 9. Show status (debug visibility)
      - name: Show deployment status
        run: |
          kubectl get pods
          kubectl get svc