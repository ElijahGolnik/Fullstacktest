name: Build and Deploy to Local Kubernetes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:

        # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Debug kubeconfig secret
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "KUBECONFIG_DATA is EMPTY"
            exit 1
          else
            echo "KUBECONFIG_DATA is set"
          fi
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        
      - name: Build and tag Docker Image
        run: docker build -t myapp:${{ github.sha }}  -t myapp:latest ./fullstackapp

      - name: Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./fullstackapp
          push: true
          tags: elijahgolnik/myapp:${{ github.sha }},elijahgolnik/myapp:latest
          platforms: linux/amd64,linux/arm64

      - name: Write kubeconfig
        run: |
          mkdir -p $HOME/.kube
          printf "%s" "${KUBECONFIG_DATA}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}

      - name: Set kubectl context
        run: kubectl config use-context docker-desktop

      # 6. Verify cluster connection (good for debugging)
      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes
          kubectl config view
          kubectl config get-contexts

      # 7. Deploy manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f fullstackapp/k8s/

      # 8. Force rollout (important when using :latest)
      - name: Restart deployment
        run: |
          kubectl rollout restart deployment fullstackapp

      # 9. Show status (debug visibility)
      - name: Show deployment status
        run: |
          kubectl get pods
          kubectl get svc